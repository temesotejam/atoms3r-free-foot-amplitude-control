name: build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify runtime, transfer, calibrated vision, acquisition and control math
        run: bash tools/test_runtime.sh
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Free-foot Runtime V2 firmware
        run: |
          set -euxo pipefail
          pio pkg install -e atoms3cam
          pio run -e atoms3cam
          test -s bmi270-build-patch.json
          "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm" .pio/build/atoms3cam/firmware.elf | grep -q '__wrap_xTaskCreatePinnedToCore'
          cat bmi270-build-patch.json
      - name: Package flash images and driver provenance
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp .pio/build/atoms3cam/{bootloader.bin,partitions.bin,firmware.bin,firmware.elf} dist/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/
          cp bmi270-build-patch.json dist/
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin -o dist/merged-firmware.bin 0x0000 dist/bootloader.bin 0x8000 dist/partitions.bin 0xe000 dist/boot_app0.bin 0x10000 dist/firmware.bin
          printf '%s\n' "$GITHUB_SHA" > dist/build-sha.txt
          printf '%s\n' 'Free-foot Runtime V2 0.47.0; RWLOG v51; immutable resumable chunks; PSRAM event store and export metadata; observation-only calibrated left/right feet; V46al-R2 control math, fixed 3ms compensation, 300mA/100ms and ESTOP retained; hardware validation pending' > dist/FLASH_LAYOUT.txt
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: atoms3r-freefoot-runtime-v2-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
